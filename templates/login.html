<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Coverage history</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Coverage history</h1>
    <span class="sub">Staff sign in</span>
    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    <form method="post">
      <div class="field"><label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
</body></html>
